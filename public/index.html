<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chá Rifa de Casa Nova · Marcela &amp; V.Gustavo</title>
  <meta name="description" content="Escolha seus números da sorte e participe da nossa Chá Rifa de Casa Nova!">
  <meta name="theme-color" content="#0f0f10">
  <meta property="og:title" content="Chá Rifa de Casa Nova · Marcela & V.Gustavo">
  <meta property="og:description" content="Escolha seus números da sorte e participe!">
  <meta property="og:image" content="https://rifa-gugaftv.web.app/img/foto-3.jpg">
  <link rel="preload" as="image" href="/img/foto-3.jpg">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-800.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/great-vibes.woff2" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <link rel="stylesheet" href="/css/site.css?v=4">
</head>
<body class="site">
  <!-- Fundo desfocado (aparece nas laterais em telas largas) -->
  <div class="fundo-pagina" aria-hidden="true"><img id="fundo-blur" src="/img/foto-3.jpg" alt=""></div>

  <div class="poster">
    <!-- Foto do casal, fixa atrás do cartaz -->
    <div class="poster-foto"><img id="hero-img" src="/img/foto-3.jpg" alt="Foto do casal" width="960" height="1280" fetchpriority="high"></div>

    <header class="topo">
      <div class="moldura">
        <span class="ponta esq" aria-hidden="true"></span>
        <span class="ponta dir" aria-hidden="true"></span>
        <h1 id="titulo">Chá Rifa de Casa Nova</h1>
        <p class="nomes" id="subtitulo">Marcela &amp; V.Gustavo</p>
      </div>
    </header>

    <main class="conteudo" id="cartela">
      <p class="dica" id="dica">Toque nos corações para escolher</p>

      <div class="grade" id="grade" role="group" aria-label="Números da cartela">
        <p class="carregando" id="carregando">Carregando…</p>
      </div>

      <div class="legenda-site" aria-hidden="true">
        <span><i class="mini"></i>Disponível</span>
        <span><i class="mini x"></i>Vendido</span>
        <span><i class="mini escolhido"></i>Escolhido</span>
      </div>

      <section class="infos" aria-label="Informações da rifa">
        <div class="pilula">
          <span id="mensagem">O sorteio será realizado assim que acabarem todos os números</span>
          <strong id="cartela-pos"></strong>
          <span class="data-sorteio" id="data-sorteio" hidden></span>
        </div>
        <div class="pilula premios" id="premios-box" hidden>
          <strong>Prêmios</strong>
          <p id="premios"></p>
        </div>
        <div class="duplas">
          <div class="pilula">
            <span>Cada número é</span>
            <strong id="preco"></strong>
          </div>
          <button type="button" class="pilula pix" id="pix-btn" hidden>
            <span>Pix</span>
            <strong id="pix"></strong>
            <small>toque para copiar</small>
          </button>
        </div>
      </section>

      <!-- Escolha de cartela: discreta, bem no final -->
      <nav class="cartelas" id="cartelas-nav" aria-label="Escolher outra cartela" hidden>
        <p>Outras cartelas</p>
        <div id="cartelas"></div>
      </nav>
    </main>
  </div>

  <!-- Barra fixa com os números selecionados -->
  <div class="carrinho" id="carrinho" hidden>
    <div class="carrinho-inner">
      <div class="carrinho-info">
        <strong id="carrinho-qtd"></strong>
        <span id="carrinho-total"></span>
        <div class="carrinho-nums" id="carrinho-nums"></div>
      </div>
      <div class="carrinho-acoes">
        <button type="button" class="btn btn-sec" id="btn-limpar">Limpar</button>
        <button type="button" class="btn btn-reservar" id="btn-reservar">Reservar</button>
      </div>
    </div>
  </div>

  <!-- Formulário de reserva -->
  <dialog id="dlg-reserva" class="dialogo">
    <form method="dialog" id="form-reserva" novalidate>
      <h2>Confirmar reserva</h2>
      <p class="dlg-resumo" id="dlg-resumo"></p>
      <label>Seu nome completo
        <input name="nome" id="in-nome" autocomplete="name" required minlength="2" maxlength="80">
      </label>
      <label>WhatsApp (com DDD)
        <input name="telefone" id="in-tel" type="tel" inputmode="tel" autocomplete="tel" required placeholder="(61) 99999-9999">
      </label>
      <p class="erro" id="form-erro" role="alert"></p>
      <div class="dlg-acoes">
        <button type="button" class="btn btn-sec" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-reservar" id="btn-confirmar">Confirmar reserva</button>
      </div>
    </form>
  </dialog>

  <!-- Resultado da reserva -->
  <dialog id="dlg-ok" class="dialogo">
    <div>
      <h2 id="ok-titulo">Reserva feita!</h2>
      <p id="ok-texto"></p>
      <div class="pix-box" id="ok-pix" hidden>
        <span>Chave Pix</span>
        <code id="ok-pix-chave"></code>
        <button type="button" class="btn btn-sec btn-peq" id="btn-copiar-pix">Copiar</button>
      </div>
      <p class="instrucoes" id="ok-instrucoes"></p>
      <div class="dlg-acoes">
        <button type="button" class="btn btn-sec" id="btn-fechar-ok">Fechar</button>
        <a class="btn btn-whats" id="ok-whats" target="_blank" rel="noopener" hidden>Enviar no WhatsApp</a>
      </div>
    </div>
  </dialog>

  <script type="module" src="/js/app.js?v=4"></script>
</body>
</html>
